name: VSCodeCMakeDemo-Build
on: [push, pull_request]

jobs:
  DemoConan-build:
    runs-on: ${{ matrix.os }}
    name: DemoConan-${{ matrix.os }}-build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-latest, macos-latest]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        if: runner.os == 'Windows' || runner.os == 'macOS'
        with:
          # Specify the most recent installed version on the runner; some conan recipes use CMake's FindPython and will then use the most recent installed version, so use the same version for everything
          python-version: 3.14.3

      - name: Enable MSVC developer shell
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Check MSVC
        if: runner.os == 'Windows'
        run: cl

      - uses: lukka/get-cmake@latest

      - name: Install Conan
        uses: conan-io/setup-conan@v1

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Conan dependencies
        run: conan install . -s build_type=Release -c "tools.cmake.cmaketoolchain:generator=Ninja Multi-Config" -c 'tools.cmake.cmakedeps:new=will_break_next' --build=missing -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True
        working-directory: DemoConan

      - name: Run CMake to configure build system
        run: cmake -S . -B build --preset conan-default -G "Ninja Multi-Config"
        working-directory: DemoConan

      - name: Run CMake to build application
        run: cmake --build build --preset conan-release
        working-directory: DemoConan
      
      - name: Run CMake to collect distributable files
        run: cmake --install build --config Release --prefix installed
        working-directory: DemoConan

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # A file, directory or wildcard pattern that describes what to upload
          # Required.
          path: DemoConan/installed
          name: DemoConan-${{ matrix.os }}

  DemoStandalone-build:
    runs-on: ${{ matrix.os }}
    name: DemoStandalone-${{ matrix.os }}-build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-latest, macos-latest]
    steps:
      - name: Enable MSVC developer shell
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Check MSVC
        if: runner.os == 'Windows'
        run: cl

      - uses: lukka/get-cmake@latest

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Run CMake to configure build system
        run: cmake -S . -B build -G "Ninja Multi-Config"
        working-directory: DemoStandalone

      - name: Run CMake to build application
        run: cmake --build build --config Release
        working-directory: DemoStandalone
      
      - name: Run CMake to collect distributable files
        run: cmake --install build --config Release --prefix installed
        working-directory: DemoStandalone

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # A file, directory or wildcard pattern that describes what to upload
          # Required.
          path: DemoStandalone/installed
          name: DemoStandalone-${{ matrix.os }}